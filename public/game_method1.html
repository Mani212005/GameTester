<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GameTester - Method 1 (SOTA VLM Baseline)</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        overflow: hidden;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        background: #0f172a;
        color: #f8fafc;
        user-select: none;
      }
      #canvas-container {
        width: 100vw;
        height: 100vh;
        cursor: crosshair;
      }
      #crosshair {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 16px;
        height: 16px;
        pointer-events: none;
        z-index: 10;
      }
      #crosshair::before,
      #crosshair::after {
        content: '';
        position: absolute;
        background: rgba(255, 255, 255, 0.85);
        box-shadow: 0 0 2px rgba(0, 0, 0, 0.8);
      }
      #crosshair::before {
        top: 7px;
        left: 0;
        width: 16px;
        height: 2px;
      }
      #crosshair::after {
        top: 0;
        left: 7px;
        width: 2px;
        height: 16px;
      }

      #hud {
        position: absolute;
        top: 16px;
        left: 16px;
        background: rgba(15, 23, 42, 0.88);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        padding: 14px;
        border-radius: 12px;
        width: 320px;
        font-size: 13px;
        line-height: 1.4;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        z-index: 20;
      }
      #hud h1 {
        font-size: 15px;
        font-weight: 700;
        color: #38bdf8;
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 6px;
      }
      .badge {
        background: #6366f1;
        color: white;
        font-size: 10px;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 6px;
      }
      .instruction-box {
        background: rgba(99, 102, 241, 0.15);
        border-left: 3px solid #6366f1;
        padding: 6px 10px;
        border-radius: 4px;
        margin-top: 6px;
        font-size: 12px;
        color: #e2e8f0;
      }
      #vlm-status {
        margin-top: 10px;
        background: #090d16;
        padding: 8px;
        border-radius: 6px;
        font-family: 'JetBrains Mono', Consolas, monospace;
        font-size: 11px;
        color: #a7f3d0;
        white-space: pre-line;
        border: 1px solid rgba(255, 255, 255, 0.05);
      }

      #hotbar-container {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 20;
      }
      #hotbar {
        display: flex;
        gap: 6px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 6px;
        border-radius: 10px;
      }
      .hotbar-slot {
        width: 50px;
        height: 50px;
        background: rgba(30, 41, 59, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 6px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
      }
      .hotbar-slot.active {
        border-color: #6366f1;
        background: rgba(99, 102, 241, 0.25);
        transform: scale(1.05);
      }
      .slot-num {
        position: absolute;
        top: 2px;
        left: 4px;
        font-size: 9px;
        font-weight: bold;
        color: #94a3b8;
      }
      .block-icon {
        width: 20px;
        height: 20px;
        border-radius: 3px;
        margin-top: 2px;
      }
      .slot-name {
        font-size: 9px;
        color: #e2e8f0;
        margin-top: 2px;
      }
    </style>
  </head>
  <body>
    <div id="canvas-container"></div>
    <div id="crosshair"></div>

    <div id="hud">
      <h1>
        Minecraft Voxel Engine
        <span class="badge">Method 1: SOTA VLM</span>
      </h1>
      <div class="instruction-box">
        <strong>🎯 Click canvas to start playing</strong>
      </div>
      <div id="vlm-status">Loading VLM Engine...</div>
    </div>

    <div id="hotbar-container">
      <div id="hotbar"></div>
    </div>

    <script type="module" src="/src/minecraft/game_method1.ts"></script>
  </body>
</html>
