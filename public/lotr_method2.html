<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GameTester - LOTR Shire Environment (Method 2: GameTester window.qaHook)</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        overflow: hidden;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        background: #0f172a;
        color: #f8fafc;
        user-select: none;
      }
      #canvas-container {
        width: 100vw;
        height: 100vh;
      }
      #hud {
        position: absolute;
        top: 16px;
        left: 16px;
        background: rgba(15, 23, 42, 0.88);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        padding: 14px;
        border-radius: 12px;
        width: 360px;
        font-size: 13px;
        line-height: 1.4;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        z-index: 20;
      }
      #hud h1 {
        font-size: 15px;
        font-weight: 700;
        color: #10b981;
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 6px;
      }
      .badge {
        background: #10b981;
        color: white;
        font-size: 10px;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 6px;
      }
      .passage-box {
        background: rgba(30, 41, 59, 0.9);
        border-left: 3px solid #f59e0b;
        padding: 8px 10px;
        border-radius: 6px;
        margin-top: 8px;
        font-size: 11px;
        color: #e2e8f0;
        font-style: italic;
        max-height: 100px;
        overflow-y: auto;
      }
      .controls-bar {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      .ctrl-btn {
        flex: 1;
        background: rgba(30, 41, 59, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: white;
        padding: 8px;
        border-radius: 6px;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .ctrl-btn:hover {
        background: rgba(16, 185, 129, 0.25);
        border-color: #10b981;
      }
    </style>
  </head>
  <body>
    <div id="canvas-container"></div>

    <div id="hud">
      <h1>
        3D Shire LOTR Environment
        <span class="badge">Interactive 3D Viewport</span>
      </h1>
      <div class="passage-box">
        "When Mr. Bilbo Baggins of Bag End announced that he would shortly be celebrating his eleventy-first birthday with a party of special magnificence, there was much talk and excitement in Hobbiton..."
      </div>
      <div class="controls-bar">
        <button class="ctrl-btn" id="btn-toggle-rotate">⏸ Pause Orbit</button>
        <button class="ctrl-btn" id="btn-toggle-walk">🚶 FPS Walkthrough Mode</button>
      </div>
    </div>

    <script type="module" src="/src/lotr/game_method2.ts"></script>
  </body>
</html>
