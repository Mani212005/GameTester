<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GameTester - Shire Build B</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { overflow: hidden; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #7a5a30; color: #f8fafc; user-select: none; }
      #canvas-container { width: 100vw; height: 100vh; cursor: crosshair; }
      #hud { position: absolute; top: 16px; left: 16px; background: rgba(40, 28, 12, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255, 200, 120, 0.4); padding: 14px; border-radius: 12px; width: 340px; font-size: 13px; line-height: 1.4; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5); z-index: 20; }
      #hud h1 { font-size: 15px; font-weight: 700; color: #ffcf7d; margin-bottom: 6px; }
      .instruction-box { background: rgba(16, 185, 129, 0.18); border-left: 3px solid #10b981; padding: 6px 10px; border-radius: 4px; margin-top: 6px; font-size: 12px; color: #fef3e2; }
      .lotr-state-preview { margin-top: 10px; background: rgba(10,7,3,0.85); padding: 8px; border-radius: 6px; font-family: 'JetBrains Mono', Consolas, monospace; font-size: 10.5px; color: #ffd98a; max-height: 150px; overflow-y: auto; border: 1px solid rgba(255, 200, 120, 0.2); word-break: break-all; }
    </style>
  </head>
  <body>
    <div id="canvas-container"></div>
    <div id="hud">
      <h1>Shire LOTR Environment</h1>
      <div class="instruction-box"><strong>Click to walk - WASD to explore the Shire</strong></div>
      <div class="lotr-state-preview">Booting scene...</div>
    </div>
    <script type="module">
      import { bootLOTRCanonical } from '/src/claude/lotr.ts';
      bootLOTRCanonical({
        container: document.getElementById('canvas-container'),
        hudEl: document.getElementById('hud'),
        neutralHud: true,
      });
    </script>
  </body>
</html>
